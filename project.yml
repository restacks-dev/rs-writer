name: RSWriter
options:
  bundleIdPrefix: nl.rs
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  RSWriter:
    type: application
    platform: macOS
    sources:
      - Sources/RSWriter
      - Sources/WriterCore
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
          - RSWriter.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.rs.writer
        PRODUCT_NAME: RS Writer
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/RSWriter.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: true
      testTargets:
        - RSWriterTests
  RSWriterTests:
    type: bundle.unit-test
    platform: macOS
    sources: Tests
    dependencies:
      - target: RSWriter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: nl.rs.writer.tests
